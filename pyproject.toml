[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-news-bot"
version = "0.1.0"
description = "Personal Telegram bot that summarizes Vietnamese news feeds"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "feedparser>=6.0,<7",
    "google-genai>=1.0,<2",
    "httpx>=0.27,<1",
    "lxml>=5.3,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
]

[project.scripts]
news-bot = "newsbot.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]


name: Telegram news bot

on:
  schedule:
    - cron: "2-59/10 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without Gemini, Telegram, or state changes"
        required: false
        default: false
        type: boolean
      limit:
        description: "Maximum articles for this run; 0 means unlimited"
        required: false
        default: "0"
        type: string

permissions:
  contents: read

concurrency:
  group: telegram-news-bot
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODELS: ${{ vars.GEMINI_MODELS || '' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      # State holds subscriber chat IDs, so it lives in a separate private repository.
      STATE_PATH: state-repo/state/seen.json
      RUN_DRY: ${{ inputs.dry_run || 'false' }}
      RUN_LIMIT: ${{ inputs.limit || '0' }}
      EVENT_NAME: ${{ github.event_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Check out private state
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.STATE_REPOSITORY }}
          ref: ${{ vars.STATE_BRANCH }}
          ssh-key: ${{ secrets.STATE_DEPLOY_KEY }}
          path: state-repo

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run tests
        if: github.event_name != 'schedule'
        run: python -m pytest -q

      - name: Fetch and deliver news
        shell: bash
        run: |
          args=()
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$RUN_DRY" == "true" ]]; then
            args+=(--dry-run)
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$RUN_LIMIT" =~ ^[1-9][0-9]*$ ]]; then
            args+=(--limit "$RUN_LIMIT")
          fi
          news-bot "${args[@]}"

      - name: Persist delivery state
        shell: bash
        run: |
          cd state-repo
          if git diff --quiet -- state/seen.json; then
            echo "Delivery state is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          git commit -m "chore: update delivery state"
          git push
